let gym=0,ex="sq",running=0,live=0,gname="",st=0,bad=0,ts=0,tb=0,fbU=0,buf=[],count=0,t0=0,inb=0,sm=null,lt=0,pose=null,stream=null,tick=null,pr=get("rc_p",{av:0,bn:0,day:""}),tmp={};
function boom(e){for(let i=0;i<20;i++){const s=document.createElement("span");s.className="bo";s.style.cssText=`background:hsl(${Math.random()*360},90%,60%);--x:${(Math.random()-.5)*320}px;--y:${-Math.random()*320-40}px;left:50%;top:60%`;document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}

 $("ban").style.backgroundImage=G[pr.bn||0];$("av").innerHTML=ic(pr.av||0);$("nm").textContent=pr.name||"Jugador";

// navegación

 $("pg").innerHTML=["Hombre","Mujer","Prefiero no decirlo"].map((x,i)=>`<button class="chip ${tmp.g===i?"sel":""}" data-g="${i}">${x}</button>`).join("");
 Q("[data-g]").forEach(b=>b.onclick=()=>{tmp.g=+b.dataset.g;paint()});Q("[data-b]").forEach(b=>b.onclick=()=>{tmp.bn=+b.dataset.b;paint()});}
$("pd").onclick=()=>{$("dl").innerHTML=D.map(d=>`<button class="chip" style="width:100%;text-align:left">${d}</button>`).join("");

const HOME=["pu","sq","ab","pl","js","rs","lu","lr","gb","hk"];
const GYM=["Press de banca","Curl de bíceps","Press de hombros","Jalón al pecho","Remo en máquina","Prensa de piernas","Sentadillas con pesas","Extensiones de piernas","Curl femoral","Abdominales en máquina","Cinta de correr","Bicicleta estática","Elevaciones laterales","Peso muerto","Extensiones de tríceps"];
function openCam(k){
 if(gym){gname=k||"";$("gn").value=gname}else if(k)ex=k;
 $("cam").classList.add("on");$("man").style.display=gym?"block":"none";$("v").style.display=$("c").style.display=gym?"none":"block";
 $("mn").textContent=gym?(gname||"Modo gym"):"IA · "+E[ex].n;$("n").textContent=count=0;$("tm").textContent="00:00";$("btn").textContent="Iniciar";
 $("msg").textContent=gym?"":"Cargando cámara...";if(!gym&&!live)camOn()}
$("go").onclick=()=>openCam();
$("eo").onclick=()=>{$("eh").textContent=gym?"Empezar con · Gym":"Empezar con · En casa";
 $("el").innerHTML=(gym?GYM:HOME.map(k=>E[k].n)).map((n,i)=>`<button class="chip" data-i="${i}" style="width:100%;text-align:left">${n}</button>`).join("");
 Q("#el .chip").forEach(b=>b.onclick=()=>{$("els").classList.remove("on");openCam(gym?GYM[b.dataset.i]:HOME[b.dataset.i])});$("els").classList.add("on")};
$("els").onclick=e=>{if(e.target==$("els"))$("els").classList.remove("on")};
function add(){count++;beep();const n=$("n");n.textContent=count;n.classList.remove("pop");void n.offsetWidth;n.classList.add("pop");
 const f=document.createElement("div");f.className="fl";f.textContent="+1";$("cam").appendChild(f);setTimeout(()=>f.remove(),1000)}
$("plus").onclick=()=>running&&add();
const CN=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,31],[28,32]];
function onR(r){const cv=$("c"),v=$("v");cv.width=v.videoWidth;cv.height=v.videoHeight;const g=cv.getContext("2d");g.clearRect(0,0,cv.width,cv.height);
 const L=r.poseLandmarks;if(!L)return;$("msg").textContent="";
 const X=i=>L[i].x*cv.width,Y=i=>L[i].y*cv.height,ok=i=>(L[i].visibility||0)>.4;
 g.lineCap="round";g.shadowColor="#00e5ff";g.shadowBlur=14;g.strokeStyle="#00e5ff";g.lineWidth=5;
 CN.forEach(([a,b])=>{if(ok(a)&&ok(b)){g.beginPath();g.moveTo(X(a),Y(a));g.lineTo(X(b),Y(b));g.stroke()}});
 g.fillStyle="#fff";[0,11,12,13,14,15,16,23,24,25,26,27,28].forEach(i=>{if(ok(i)){g.beginPath();g.arc(X(i),Y(i),i?6:9,0,7);g.fill()}});
 if(!running||gym)return;
 const vs=a=>a.reduce((s,i)=>s+(L[i].visibility||0),0);
 const P=vs([11,23,25,27,13,15])>=vs([12,24,26,28,14,16])?{s:11,h:23,k:25,a:27,e:13,w:15}:{s:12,h:24,k:26,a:28,e:14,w:16};
 const La=L.map(p=>({x:p.x*(cv.width||4)/(cv.height||3),y:p.y,visibility:p.visibility}));
 const e=E[ex],lw=["pu","sq","ab","pl","lr","gb"].includes(ex),need=ex=="pu"?[P.s,P.e,P.w]:[P.s,P.h,P.k,P.a];
 if(lw&&need.some(i=>(L[i].visibility||0)<.5)){$("fb").textContent="Ponte de lado y que se vea tu cuerpo completo";return}
 buf.push(e.f(La,P));if(buf.length>5)buf.shift();
 const med=[...buf].sort((a,b)=>a-b)[buf.length>>1];sm=sm==null?med:sm*.5+med*.5;const m=sm,now=Date.now();
 $("ang").textContent=["bu","js","rs","hk"].includes(ex)?"":Math.round(m)+"°";
 if(e.hold){const ok=m>155&&Math.abs(L[P.s].y-L[P.a].y)<.3;$("fb").textContent=ok?"Plancha firme":"Alinea cadera y piernas";if(ok){if(now-lt>=1000){lt+=1000;add()}}else lt=now;return}
 const [t1,t2,d]=e.t,fast=["js","rs","hk"].includes(ex);
 $("dbf").style.height=Math.max(0,Math.min(1,(m-t2)/(t1-t2)))*100+"%";
 const up=d==1?m>t2:m<t2,dn=d==1?m<t1:m>t1,fb=t=>{$("fb").textContent=t;fbU=now+1400};
 if(ex=="sq"&&st>0&&Math.abs(Math.atan2(La[P.s].x-La[P.h].x,La[P.h].y-La[P.s].y))*180/Math.PI>65)fb("Pecho arriba, no te inclines tanto");
 if(st==0){if(d==1?m<t2-6:m>t2+6){st=1;ts=now}}
 else{if(st==1&&dn){st=2;tb=now}
  if(up){const dur=now-ts;
   if(st==2&&dur>=(fast?120:450)){add();if(!fast&&dur<900)fb("Muy rápido, controla el movimiento");else if(ex=="sq")fb("Sentadilla correcta")}
   else if(st==1&&!fast&&dur>=350){bad++;fb(ex=="sq"?"Incompleta: baja hasta que el muslo quede paralelo":"Incompleta: completa el movimiento")}
   st=0}}
 if(now>fbU)$("fb").textContent=(ex=="sq"?["Listo, baja","Baja más","Ahora sube"]:["Listo","Sigue","Regresa"])[st]}
async function loop(){if(!live)return;try{await pose.send({image:$("v")})}catch(e){}requestAnimationFrame(loop)}
async function camOn(){
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480},audio:false});
  $("v").srcObject=stream;await $("v").play();
  if(!pose){pose=new Pose({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/"+f});
   pose.setOptions({modelComplexity:1,smoothLandmarks:true,minDetectionConfidence:.6,minTrackingConfidence:.6});pose.onResults(onR)}
  live=1;loop()}catch(e){$("msg").textContent="No se pudo usar la cámara o cargar el modelo. Revisa los permisos."}}
function camOff(){live=0;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
async function start(){count=0;st=0;bad=0;buf=[];sm=null;$("n").textContent=0;t0=lt=Date.now();running=1;$("btn").textContent="Detener";
 tick=setInterval(()=>$("tm").textContent=fmt(Math.floor((Date.now()-t0)/1000)),500);if(!gym&&!live)await camOn()}
function stop(){running=0;clearInterval(tick);const s=Math.floor((Date.now()-t0)/1000);
 if(count>0){const a=get("rc_s",[]);a.push({d:today(),m:gym?($("gn").value||"Gym"):E[ex].n,r:count,s,g:gym,kg:+$("gk").value||0});put("rc_s",a);boom();home()}
 $("btn").textContent="Iniciar";$("fb").textContent="";$("msg").textContent=count?`¡Misión cumplida! ${count} en ${fmt(s)}${bad?` · ${bad} incompletas`:""}`:""}
$("btn").onclick=()=>running?stop():start();
$("x").onclick=()=>{if(running)stop();camOff();$("cam").classList.remove("on")};
function chart(){const days={};get("rc_s",[]).forEach(x=>days[x.d]=(days[x.d]||0)+x.r);const k=Object.keys(days).sort().slice(-14);
 if(!k.length){$("chart").textContent="Aún no hay sesiones. ¡Haz tu primera misión!";$("delta").textContent="";return}
 const mx=Math.max(...k.map(x=>days[x])),W=Math.max(300,k.length*44),H=200;
 $("chart").innerHTML=`<svg width="${W}" height="${H+30}" role="img" aria-label="Repeticiones por día"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#b14cff"/></linearGradient></defs>`+
 k.map((d,i)=>{const h=days[d]/mx*(H-20),x=i*44+8;return `<rect x="${x}" y="${H-h}" width="30" height="${h}" rx="7" fill="url(#gr)"/><text x="${x+15}" y="${H-h-4}" font-size="12" text-anchor="middle" fill="#fff">${days[d]}</text><text x="${x+15}" y="${H+16}" font-size="11" text-anchor="middle" fill="#9d96c9">${d.slice(8)}/${d.slice(5,7)}</text>`}).join("")+"</svg>";
 if(k.length>1){const d=days[k[k.length-1]]-days[k[k.length-2]];$("delta").innerHTML=d>0?`¡Subiste de nivel! <b>+${d}</b> vs. el día anterior.`:d<0?`Bajaste <b>${d}</b> vs. el día anterior. ¡A recuperarlo!`:"Igual que el día anterior."}
 else $("delta").textContent="Sigue entrenando para comparar tus días.";
 $("hist").innerHTML="<b>Últimas sesiones</b>"+get("rc_s",[]).slice(-5).reverse().map(x=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ffffff14"><span>${x.m}${x.kg?" · "+x.kg+" kg":""}</span><b>${x.r}</b></div>`).join("")}
function beep(){try{const c=beep.c||(beep.c=new AudioContext()),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08);navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".btn,.chip,nav button");if(!b)return;const r=b.getBoundingClientRect(),w=document.createElement("span");w.className="rp";w.style.cssText=`left:${e.clientX-r.left}px;top:${e.clientY-r.top}px`;b.appendChild(w);setTimeout(()=>w.remove(),600)});
